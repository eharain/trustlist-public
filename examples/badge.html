<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrustList badge example</title>
</head>
<body style="font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px">
  <h1>TrustList badge example</h1>
  <p>Replace the slug and page with your own listing and ranking.</p>

  <trustlist-badge type="company" slug="your-company" page="/best/web-design-agency/london">
    <a href="https://trustlist.uk/best/web-design-agency/london">TrustList: Top Web Design Agencies in London</a>
  </trustlist-badge>

  <script type="module" src="../packages/badge/src/trustlist-badge.js"></script>
</body>
</html>
